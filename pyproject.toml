[project]
name = "ai-travel-planning-system-using-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anandsharma", email = "sanand148@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-groq",
    "langchain-openai",
    "langchain-tavily",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mysql[pymysql]>=3.0.0",
    "psycopg-pool",
    "psycopg[binary]",
    "python-dotenv>=1.2.3",
    "requests",
    "streamlit",
    "tavily-python",
]

[project.scripts]
ai-travel-planning-system-using-langgraph = "ai_travel_planning_system_using_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
